defaults:
  - SimNPO

handler: SampleEarlyStopSimNPOIrreversible

args:
  dataloader_drop_last: false

method_args:
  delta: 0.0
  beta: 4.5
  alpha: 1.0
  gamma: 0.125
  retain_loss_type: NLL

  # Same criterion as SampleEarlyStopNPOLossIrreversible:
  # mean(abs(latest 3 normalized-NLL second differences)) <= threshold.
  stop_threshold: 1.0e-2
