defaults:
  - NPO

handler: SampleStopNPO

method_args:
  # Sample-wise stopping parameters
  progress_threshold: 0.70
  gain_threshold: 0.03
  curvature_threshold: 0.02

  # A second difference requires at least three observations.
  window_size: 4
  warmup_observations: 4
  patience: 2

  log_interval: 50
  epsilon: 1.0e-8
