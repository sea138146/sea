defaults:
  - NPO

handler: SampleEarlyStopNPOMarginalRatio

args:
  dataloader_drop_last: false
  dataloader_num_workers: 0

method_args:
  beta: 0.1
  alpha: 1.0
  gamma: 1.0
  retain_loss_type: NLL

  moving_average_window: 3
  stop_ratio_threshold: 0.1
  rebound_ratio_threshold: 0.2
  ratio_epsilon: 1.0e-8
  initial_nll_cache_path: null

  # Stopped samples keep their baseline batch slots but contribute no forget
  # gradient. Retain updates continue, and all forget samples receive one
  # forward-only normalized-NLL snapshot at every epoch end.
