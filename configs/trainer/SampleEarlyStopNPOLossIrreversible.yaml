defaults:
  - NPO

handler: SampleEarlyStopNPOLossIrreversible

args:
  dataloader_drop_last: false
  dataloader_num_workers: 0

method_args:
  beta: 0.1
  alpha: 1.0
  gamma: 1.0
  retain_loss_type: NLL

  # Epochs 1-2 only record NLL gain. Decisions start at epoch 3.
  warm_up: 2

  # Stop active samples at or above gain_threshold.
  gain_threshold: 2.0
  patience: 2

  # Reactivate stopped samples at or below
  # gain_threshold - rebound_delta for reactivation_patience snapshots.
  rebound_delta: 0.2
  # null makes reactivation patience equal to stop patience.
  reactivation_patience: null

  # Optional split/model-specific cache. When present it is validated and
  # loaded; when absent it is generated atomically from the fixed model.
  initial_nll_cache_path: null

  # Stopped samples remain excluded from forget loss, receive a forward-only
  # snapshot every epoch, and return to forget updates after reactivation.
